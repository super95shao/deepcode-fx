<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src {{cspSource}} data: blob:; style-src {{cspSource}} 'unsafe-inline'; script-src {{cspSource}} 'nonce-{{nonce}}';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepCode FX</title>
    <link rel="stylesheet" href="{{cssUri}}" />
  </head>
  <body>
    <div class="app">
      <div class="header-container">
        <div class="header-left">
          <div class="session-selector" id="sessionSelector">
            <div class="session-selector-title" id="sessionSelectorTitle">
              <img class="session-logo" src="{{iconUri}}" alt="" />
              <span class="session-title-text" id="sessionSelectorTitleText">DeepCode FX</span>
            </div>
            <svg class="session-selector-icon" viewBox="0 0 1024 1024" aria-hidden="true">
              <path
                d="M884 256h-75c-5.1 0-9.9 2.5-12.9 6.6L512 654.2 227.9 262.6c-3-4.1-7.8-6.6-12.9-6.6h-75c-6.5 0-10.3 7.4-6.5 12.7l352.6 486.1c12.8 17.6 39 17.6 51.7 0l352.6-486.1c3.9-5.3.1-12.7-6.4-12.7z"
              ></path>
            </svg>
          </div>
        </div>
        <button class="header-new-btn" id="newSessionBtn" title="New chat">
          <svg
            class="header-new-icon"
            viewBox="0 0 1024 1024"
            width="16"
            height="16"
            aria-hidden="true"
          >
            <path d="M474 152m8 0l60 0q8 0 8 8l0 704q0 8-8 8l-60 0q-8 0-8-8l0-704q0-8 8-8Z"></path>
            <path d="M168 474m8 0l672 0q8 0 8 8l0 60q0 8-8 8l-672 0q-8 0-8-8l0-60q0-8 8-8Z"></path>
          </svg>
        </button>
        <div class="session-dropdown" id="sessionDropdown"></div>
      </div>

      <!-- 跨工作区提示横幅 -->
      <div class="workspace-banner" id="workspaceBanner" style="display:none">
        <span class="workspace-banner-icon">⚡</span>
        <span class="workspace-banner-text">
          This conversation belongs to: <strong class="workspace-banner-path"></strong>
        </span>
        <button class="workspace-banner-btn" id="workspaceSwitchBtn">Switch here</button>
        <button class="workspace-banner-close" id="workspaceBannerClose">✕</button>
      </div>

      <!-- 聊天视图 -->
      <div class="chat-container" id="chatContainer">
        <div class="messages" id="messages"></div>
        <div class="loading" id="loading">
          <div class="spinner"></div>
          <span>Thinking...</span>
        </div>
        <div class="composer">
          <!-- Skills Popup -->
          <div class="skills-popup" id="skillsPopup">
            <div class="skills-popup-header">Select Skills</div>
            <div class="skills-popup-list" id="skillsPopupList"></div>
          </div>
          <div class="input-wrap">
            <div class="tools-line"></div>
            <textarea id="prompt" placeholder="Write a prompt..." rows="3"></textarea>
            <div class="composer-footer">
              <div class="skills-bar">
                <button class="skills-button" id="skillsButton" title="Select Skills">
                  <svg viewBox="0 0 1102 1024" width="18" height="18" aria-hidden="true">
                    <path
                      d="M1080.647345 359.858716l-149.888622 86.404529v341.128546c0 12.287244-6.616208 23.629315-17.564458 30.00923l-344.594179 201.243001a38.121962 38.121962 0 0 1-38.437019 0l-344.594179-201.243001a34.813858 34.813858 0 0 1-17.564458-29.930465V446.026952L17.879515 359.858716A34.971386 34.971386 0 0 1 0 329.691957c0-12.287244 6.773737-23.70808 17.879515-30.166759L530.320596 5.025168a38.594548 38.594548 0 0 1 37.885668 0l512.441081 294.578795c11.027014 6.301151 17.879515 17.800751 17.879515 30.087994a34.971386 34.971386 0 0 1-17.879515 30.166759zM549.224048 76.149406l-441.080549 253.621316 441.080549 253.463787 441.080549-253.542552-441.080549-253.542551z m307.811211 412.331549L568.206264 654.516276a38.358255 38.358255 0 0 1-37.885668 0L241.491601 488.402191v279.377269l307.732447 179.740323 307.811211-179.740323V488.402191z m208.883146-65.847025c20.321211 0 36.782967 15.752877 36.782967 35.20768v197.698603c0 19.533567-16.540521 35.286444-36.782967 35.286444a35.995323 35.995323 0 0 1-36.782967-35.20768V457.84161c0-19.454803 16.461756-35.20768 36.782967-35.20768z"
                    />
                  </svg>
                  <span>Skill</span>
                </button>
                <div class="context-meter" id="contextMeter" aria-label="Context usage">
                  <div class="context-meter-ring" id="contextMeterRing"></div>
                  <div class="context-meter-tooltip" id="contextMeterTooltip" role="tooltip"></div>
                </div>
                <button class="toolbar-btn" id="compactBtn" title="Compact context">🗜</button>
                <button class="toolbar-btn" id="settingsBtn" title="Settings">
                  <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                    <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94L14.4 2.81a.48.48 0 0 0-.47-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.49.49 0 0 0 .12.61l2.03 1.58c-.05.3-.07.63-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.03-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/>
                  </svg>
                </button>
                <div class="toolbar-dropdown" id="modelDropdownWrap">
                  <button class="toolbar-btn" id="modelToggleBtn" title="Switch model">Model: pro</button>
                  <div class="toolbar-popup" id="modelPopup">
                    <div class="toolbar-popup-item" data-val="deepseek-v4-pro">deepseek-v4-pro</div>
                    <div class="toolbar-popup-item" data-val="deepseek-v4-flash">deepseek-v4-flash</div>
                  </div>
                </div>
                <div class="toolbar-dropdown" id="thinkingDropdownWrap">
                  <button class="toolbar-btn" id="thinkingToggleBtn" title="Switch reasoning effort">Reasoning: max</button>
                  <div class="toolbar-popup" id="thinkingPopup">
                    <div class="toolbar-popup-item" data-val="max">max</div>
                    <div class="toolbar-popup-item" data-val="high">high</div>
                  </div>
                </div>
                <div class="skills-tags" id="skillsTags"></div>
              </div>
              <button class="balance-btn" id="balanceBtn" title="DeepSeek Balance">
                <span class="balance-display">
                  <span class="balance-icon">⛁</span>
                  <span class="balance-amount" id="balanceAmount">--</span>
                </span>
              </button>
              <button class="send-button" id="send" title="Send">
                <svg class="send-icon" id="sendIcon" viewBox="0 0 32 32" aria-hidden="true">
                  <path
                    d="M27,5c-2.9-2.9-6.9-4.6-11-4.6S7.9,2.1,5,5c-2.9,2.9-4.6,6.9-4.6,11S2.1,24.1,5,27c2.9,2.9,6.9,4.6,11,4.6 s8.1-1.6,11-4.6c2.9-2.9,4.6-6.9,4.6-11S29.9,7.9,27,5z M23.2,11c-0.2,2.5-1.2,8.4-1.8,11.2c-0.2,1.2-0.6,1.6-1.1,1.6 c-0.9,0.1-1.6-0.6-2.5-1.2c-1.4-0.9-2.1-1.5-3.5-2.3c-1.5-1-0.5-1.6,0.3-2.5c0.2-0.2,4.2-3.9,4.3-4.2c0,0,0-0.2-0.1-0.3 c-0.1-0.1-0.2-0.1-0.3,0c-0.1,0-2.3,1.5-6.6,4.3c-0.6,0.4-1.2,0.6-1.7,0.6c-0.6,0-1.6-0.3-2.4-0.6c-1-0.3-1.7-0.5-1.7-1 c0-0.3,0.4-0.6,1.2-0.9c4.5-2,7.6-3.3,9.1-3.9c4.3-1.8,5.2-2.1,5.8-2.1c0.1,0,0.4,0,0.6,0.2c0.2,0.1,0.2,0.3,0.2,0.4 C23.2,10.5,23.2,10.8,23.2,11L23.2,11z"
                  />
                </svg>
                <svg class="send-icon" id="stopIcon" viewBox="0 0 32 32" aria-hidden="true">
                  <path
                    d="M5,4.9c-6.1,6.1-6.1,16,0,22.1c6.1,6.1,16,6.1,22.1,0s6.1-16,0-22.1C21-1.1,11.1-1.2,5,4.9z M21,12.5l0,7 c0,0.8-0.7,1.5-1.5,1.5l-7,0c-0.8,0-1.5-0.7-1.5-1.5l0-7c0-0.8,0.7-1.5,1.5-1.5l7,0C20.3,11,21,11.7,21,12.5z"
                  />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- 设置页面 -->
      <div class="settings-page" id="settingsPage" style="display: none;">
        <div class="settings-page-header">
          <button class="settings-close-btn" id="settingsCloseBtn" title="Close">✕</button>
          <span class="settings-page-title">Settings</span>
        </div>
        <div class="settings-page-content">
          <!-- 全局设置 -->
          <details class="settings-section" open>
            <summary class="settings-section-title">Global Settings  <span class="settings-section-path">~/.deepcode/settings.json</span></summary>
            <div class="settings-section-body">
              <label class="settings-field">
                <span class="settings-label">API Key</span>
                <input type="password" class="settings-input" id="userApiKey" placeholder="sk-..." spellcheck="false" />
              </label>
              <label class="settings-field">
                <span class="settings-label">Model</span>
                <select class="settings-select" id="userModel">
                  <option value="deepseek-v4-flash">deepseek-v4-flash</option>
                  <option value="deepseek-v4-pro">deepseek-v4-pro</option>
                </select>
              </label>
              <label class="settings-field settings-field-checkbox">
                <input type="checkbox" class="settings-checkbox" id="userThinkingEnabled" />
                <span class="settings-label">Thinking Enabled</span>
              </label>
              <label class="settings-field" id="userReasoningField">
                <span class="settings-label">Reasoning Effort</span>
                <select class="settings-select" id="userReasoningEffort">
                  <option value="max">max</option>
                  <option value="high">high</option>
                </select>
              </label>
              <button class="settings-save-btn" id="userSettingsSave">Save Global Settings</button>
              <span class="settings-save-feedback" id="userSettingsFeedback"></span>
            </div>
          </details>
          <!-- 项目设置 -->
          <details class="settings-section" open>
            <summary class="settings-section-title">Project Settings  <span class="settings-section-path">./.deepcode/settings.json</span></summary>
            <div class="settings-section-body">
              <label class="settings-field">
                <span class="settings-label">API Key</span>
                <input type="password" class="settings-input" id="projectApiKey" placeholder="sk-..." spellcheck="false" />
              </label>
              <label class="settings-field">
                <span class="settings-label">Model</span>
                <select class="settings-select" id="projectModel">
                  <option value="deepseek-v4-flash">deepseek-v4-flash</option>
                  <option value="deepseek-v4-pro">deepseek-v4-pro</option>
                </select>
              </label>
              <label class="settings-field settings-field-checkbox">
                <input type="checkbox" class="settings-checkbox" id="projectThinkingEnabled" />
                <span class="settings-label">Thinking Enabled</span>
              </label>
              <label class="settings-field" id="projectReasoningField">
                <span class="settings-label">Reasoning Effort</span>
                <select class="settings-select" id="projectReasoningEffort">
                  <option value="max">max</option>
                  <option value="high">high</option>
                </select>
              </label>
              <button class="settings-save-btn" id="projectSettingsSave">Save Project Settings</button>
              <span class="settings-save-feedback" id="projectSettingsFeedback"></span>
            </div>
          </details>
          <!-- 工作区 -->
          <details class="settings-section" open>
            <summary class="settings-section-title">Workspace</summary>
            <div class="settings-section-body">
              <span class="settings-label">Current workspace:</span>
              <div class="settings-workspace-row">
                <span class="settings-workspace-path" id="workspaceDisplay"></span>
                <input type="text" class="settings-input settings-workspace-input" id="workspaceInput" placeholder="Enter path..." />
                <button class="settings-save-btn" id="workspaceApplyBtn">Apply</button>
              </div>
            </div>
          </details>
        </div>
      </div>
    </div>

    <script nonce="{{nonce}}" src="{{attachmentsJsUri}}"></script>
    <script nonce="{{nonce}}">
      const vscode = acquireVsCodeApi();
      const workspaceRoot = {{workspaceRoot}};
      const app = document.querySelector(".app");
      const messages = document.getElementById("messages");
      const inputWrap = document.querySelector(".input-wrap");
      const toolsLine = document.querySelector(".tools-line");
      const promptInput = document.getElementById("prompt");
      const promptMinRows = Number(promptInput?.getAttribute("rows")) || 3;
      const promptMaxRows = 10;
      const sendButton = document.getElementById("send");
      const loading = document.getElementById("loading");
      const sessionSelector = document.getElementById("sessionSelector");
      const sessionSelectorTitle = document.getElementById("sessionSelectorTitle");
      const sessionSelectorTitleText = document.getElementById("sessionSelectorTitleText");
      const sessionDropdown = document.getElementById("sessionDropdown");
      const newSessionBtn = document.getElementById("newSessionBtn");
      const sendIcon = document.getElementById("sendIcon");
      const stopIcon = document.getElementById("stopIcon");
      const skillsButton = document.getElementById("skillsButton");
      const skillsPopup = document.getElementById("skillsPopup");
      const skillsPopupList = document.getElementById("skillsPopupList");
      const skillsTags = document.getElementById("skillsTags");
      const contextMeter = document.getElementById("contextMeter");
      const compactBtn = document.getElementById("compactBtn");
      const contextMeterRing = document.getElementById("contextMeterRing");
      const contextMeterTooltip = document.getElementById("contextMeterTooltip");

      const attachmentManager = typeof window.createPromptAttachmentManager === "function"
        ? window.createPromptAttachmentManager({
          promptInput,
          inputWrap,
          toolsLine,
          onAttachmentChange: () => {
            updateSendIconState();
          }
        })
        : null;

      // Prompt history navigation (ArrowUp/ArrowDown)
      let inputHistory = []; // user prompts in the current session, oldest -> newest
      let historyCursor = -1; // -1 means not browsing history; otherwise 0..inputHistory.length-1
      let draftBeforeHistory = null; // preserved draft when entering history browsing
      let pendingUserPrompt = null; // last prompt sent, used to reduce double-recording
      let lastHistoryRecordText = "";
      let lastHistoryRecordAt = 0;

      function exitHistoryBrowsing() {
        if (historyCursor === -1) return;
        historyCursor = -1;
        draftBeforeHistory = null;
      }

      let currentSessionId = null;
      let currentSessionStatus = null;
      let allSessions = [];
      let sessionSearchInput = null;
      let sessionDropdownList = null;
      let lastMessageRole = null;
      let currentThinkingBubble = null; // 记录当前展开的思考气泡
      let availableSkills = []; // 可用的技能列表
      let selectedSkills = []; // 已选择的技能
      let currentRunningProcesses = null; // 当前正在运行的进程: Record<string, { startTime: string; command: string }> | null
      let loadingUpdateTimer = null; // 定时更新loading文本的计时器
      let currentLlmStreamProgress = null;
      let currentTokenTelemetry = null;

      function isBusyStatus(status) {
        return status === "processing" || status === "pending";
      }

      function isProcessing() {
        return isBusyStatus(currentSessionStatus);
      }

      function getPromptLineHeight() {
        const styles = window.getComputedStyle(promptInput);
        const lineHeight = parseFloat(styles.lineHeight);
        if (Number.isFinite(lineHeight)) {
          return lineHeight;
        }

        const fontSize = parseFloat(styles.fontSize) || 13;
        return fontSize * 1.4;
      }

      function getPromptVerticalSize() {
        const styles = window.getComputedStyle(promptInput);
        const paddingTop = parseFloat(styles.paddingTop) || 0;
        const paddingBottom = parseFloat(styles.paddingBottom) || 0;
        const borderTop = parseFloat(styles.borderTopWidth) || 0;
        const borderBottom = parseFloat(styles.borderBottomWidth) || 0;
        return paddingTop + paddingBottom + borderTop + borderBottom;
      }

      function autoResizePrompt() {
        if (!promptInput) {
          return;
        }

        const lineHeight = getPromptLineHeight();
        const verticalSize = getPromptVerticalSize();
        const minHeight = Math.ceil(lineHeight * promptMinRows + verticalSize);
        const maxHeight = Math.ceil(lineHeight * promptMaxRows + verticalSize);

        promptInput.style.height = "auto";
        const nextHeight = Math.min(Math.max(promptInput.scrollHeight, minHeight), maxHeight);
        promptInput.style.height = `${nextHeight}px`;
        promptInput.style.overflowY = promptInput.scrollHeight > maxHeight ? "auto" : "hidden";
      }

      function getTokenUsagePercent(telemetry) {
        const activeTokens = Number(telemetry?.activeTokens || 0);
        const threshold = Number(telemetry?.compactPromptTokenThreshold || 0);
        if (!Number.isFinite(activeTokens) || !Number.isFinite(threshold) || threshold <= 0) {
          return 0;
        }
        return Math.trunc(0.5 * activeTokens / threshold * 100);
      }

      function formatTokenCount(value) {
        const number = Number(value || 0);
        if (!Number.isFinite(number)) {
          return "0";
        }
        return number.toLocaleString();
      }

      function flattenUsageFields(value, prefix = "") {
        if (!value || typeof value !== "object" || Array.isArray(value)) {
          return [];
        }

        const rows = [];
        Object.entries(value).forEach(([key, nestedValue]) => {
          const fieldName = prefix ? `${prefix}.${key}` : key;
          if (nestedValue && typeof nestedValue === "object" && !Array.isArray(nestedValue)) {
            rows.push(...flattenUsageFields(nestedValue, fieldName));
          } else {
            rows.push([fieldName, nestedValue]);
          }
        });
        return rows;
      }

      function formatUsageFieldLabel(label) {
        if (label === "prompt_tokens_details.cached_tokens") {
          return "prompt_cached_tokens";
        }
        if (label === "completion_tokens_details.reasoning_tokens") {
          return "completion_reasoning_tokens";
        }
        return label;
      }

      function addTooltipRow(container, label, value) {
        const row = document.createElement("div");
        row.className = "context-tooltip-row";

        const labelNode = document.createElement("span");
        labelNode.className = "context-tooltip-label";
        labelNode.textContent = label;

        const valueNode = document.createElement("span");
        valueNode.className = "context-tooltip-value";
        valueNode.textContent = String(value);

        row.appendChild(labelNode);
        row.appendChild(valueNode);
        container.appendChild(row);
      }

      function renderContextMeterTooltip(telemetry, percent) {
        if (!contextMeterTooltip) {
          return;
        }

        contextMeterTooltip.innerHTML = "";

        const title = document.createElement("div");
        title.className = "context-tooltip-title";
        title.textContent = "Context Window";
        contextMeterTooltip.appendChild(title);

        const summary = document.createElement("div");
        summary.className = "context-tooltip-summary";
        summary.textContent = `${percent}% used`;
        contextMeterTooltip.appendChild(summary);

        addTooltipRow(contextMeterTooltip, "model", telemetry?.model || "unknown");
        addTooltipRow(contextMeterTooltip, "thinking enabled", telemetry?.thinkingEnabled ? "true" : "false");
        addTooltipRow(contextMeterTooltip, "reasoning effort", telemetry?.reasoningEffort || "max");
        addTooltipRow(contextMeterTooltip, "activeTokens", formatTokenCount(telemetry?.activeTokens));

        const usageRows = flattenUsageFields(telemetry?.usage);
        if (usageRows.length > 0) {
          const section = document.createElement("div");
          section.className = "context-tooltip-section";
          section.textContent = "session.usage";
          contextMeterTooltip.appendChild(section);
          usageRows.forEach(([key, value]) => {
            addTooltipRow(
              contextMeterTooltip,
              formatUsageFieldLabel(key),
              typeof value === "number" ? formatTokenCount(value) : value
            );
          });
        }
      }

      function updateContextMeter(telemetry) {
        currentTokenTelemetry = telemetry || null;
        const percent = getTokenUsagePercent(currentTokenTelemetry);
        const cappedPercent = Math.max(0, Math.min(percent, 100));

        if (contextMeterRing) {
          contextMeterRing.style.setProperty("--context-percent", `${cappedPercent}%`);
        }
        if (contextMeter) {
          contextMeter.setAttribute("aria-label", `Context usage ${percent}%`);
        }
        renderContextMeterTooltip(currentTokenTelemetry, percent);
      }

      function updateContextMeterTooltipPosition() {
        if (!contextMeter || !contextMeterTooltip) {
          return;
        }

        const meterRect = contextMeter.getBoundingClientRect();
        const tooltipRect = contextMeterTooltip.getBoundingClientRect();
        const margin = 8;
        const centeredLeft = meterRect.left + meterRect.width / 2 - tooltipRect.width / 2;
        const left = Math.max(margin, Math.min(centeredLeft, window.innerWidth - tooltipRect.width - margin));
        const top = Math.max(margin, meterRect.top - tooltipRect.height - 10);

        contextMeterTooltip.style.left = `${left}px`;
        contextMeterTooltip.style.top = `${top}px`;
        contextMeterTooltip.style.bottom = "auto";
      }

      function getAttachedImageUrls() {
        return attachmentManager ? attachmentManager.getImageUrls() : [];
      }

      contextMeter?.addEventListener("mouseenter", () => {
        requestAnimationFrame(updateContextMeterTooltipPosition);
      });

      // Skills functions
      function showSkillsPopup() {
        if (skillsPopup) {
          skillsPopup.classList.add("show");
          // 渲染技能列表
          renderSkillsList();
        }
      }

      function hideSkillsPopup() {
        if (skillsPopup) {
          skillsPopup.classList.remove("show");
        }
      }

      function renderSkillsList() {
        if (!skillsPopupList) return;
        skillsPopupList.innerHTML = "";

        if (availableSkills.length === 0) {
          skillsPopupList.innerHTML = '<div class="skills-popup-empty">No skills found</div>';
          return;
        }

        availableSkills.forEach((skill) => {
          const item = document.createElement("div");
          item.className = "skills-popup-item";
          const isSelected = selectedSkills.some((s) => s.name === skill.name);
          if (isSelected) {
            item.classList.add("selected");
          }
          item.title = skill.path; // 鼠标悬停显示完整路径
          item.innerHTML = `
            <span class="skills-popup-item-name" title="${escapeHtml(skill.name)}">${escapeHtml(skill.name)}</span>
            <span class="skills-popup-item-path" title="${escapeHtml(skill.path)}">${escapeHtml(skill.path)}</span>
            ${skill.isLoaded ? '<span class="skills-popup-item-loaded">✓</span>' : ''}
          `;
          item.addEventListener("click", () => {
            toggleSkill(skill);
          });
          skillsPopupList.appendChild(item);
        });
      }

      function toggleSkill(skill) {
        const index = selectedSkills.findIndex((s) => s.name === skill.name);
        if (index >= 0) {
          selectedSkills.splice(index, 1);
        } else {
          selectedSkills.push(skill);
        }
        renderSkillsTags();
        renderSkillsList();
      }

      function removeSkill(skillName) {
        selectedSkills = selectedSkills.filter((s) => s.name !== skillName);
        renderSkillsTags();
        renderSkillsList();
      }

      function renderSkillsTags() {
        if (!skillsTags) return;
        // 使用 inner 容器包裹 tags，实现省略号效果
        let inner = skillsTags.querySelector(".skills-tags-inner");
        if (!inner) {
          inner = document.createElement("div");
          inner.className = "skills-tags-inner";
          skillsTags.appendChild(inner);
        }
        inner.innerHTML = "";

        selectedSkills.forEach((skill) => {
          const tag = document.createElement("div");
          tag.className = "skill-tag";
          tag.innerHTML = `
            <span class="skill-tag-name">${escapeHtml(skill.name)}</span>
            <span class="skill-tag-remove">&times;</span>
          `;
          tag.querySelector(".skill-tag-remove").addEventListener("click", (e) => {
            e.stopPropagation();
            removeSkill(skill.name);
          });
          inner.appendChild(tag);
        });
      }

      function updateSkillsButtonTooltip() {
        if (skillsButton) {
          if (availableSkills.length === 0) {
            skillsButton.title = "skills from ~/.agents/skills/ can be discovered and activated.";
          } else {
            skillsButton.title = "Select Skills";
          }
        }
      }

      // 点击技能按钮
      skillsButton?.addEventListener("click", (e) => {
        e.stopPropagation();
        if (skillsPopup && skillsPopup.classList.contains("show")) {
          hideSkillsPopup();
        } else {
          showSkillsPopup();
        }
      });

      // 点击其他地方关闭技能弹窗

        if (skillsPopup && skillsButton && !skillsPopup.contains(event.target) && !skillsButton.contains(event.target)) {

        }
      });

      function setThinkingBubbleExpanded(bubble, expanded) {
        if (!bubble) return;
        const contentDiv = bubble.querySelector(".bubble-collapsible-content");
        const toggleBtn = bubble.querySelector(".bubble-toggle");

        if (expanded) {
          contentDiv.classList.remove("collapsed");
          toggleBtn.classList.add("expanded");
        } else {
          contentDiv.classList.add("collapsed");
          toggleBtn.classList.remove("expanded");

      function setAskUserQuestionFormState(form, interactive) {
        if (!form) return;
        form.dataset.interactive = interactive ? "true" : "false";
        const controls = form.querySelectorAll("input, textarea, button");
        controls.forEach((control) => {
          control.disabled = !interactive;
        });

        const submitButton = form.querySelector(".ask-user-question-submit");
        if (submitButton) {
          submitButton.hidden = !interactive;
        }
      }

      function updateAskUserQuestionInteractivity() {
        const interactive = currentSessionStatus === "waiting_for_user";
        const forms = messages.querySelectorAll(".ask-user-question-form");
        forms.forEach((form) => {
          setAskUserQuestionFormState(form, interactive);
        });
      }

      function buildAskUserQuestionReply(questions, form) {
        const lines = ["Answer to AskUserQuestion:"];

        for (let index = 0; index < questions.length; index += 1) {
          const question = questions[index];
          const selectedOptions = Array.from(
            form.querySelectorAll(`input[name="askq-${index}-option"]:checked`)
          ).map((input) => input.value).filter(Boolean);
          const otherInput = form.querySelector(`textarea[name="askq-${index}-other"]`);
          const otherText = otherInput ? otherInput.value.trim() : "";

          if (selectedOptions.length === 0 && !otherText) {
            return {
              ok: false,
              error: `Please answer question ${index + 1}.`
            };
          }

          lines.push("");
          lines.push(`${index + 1}. ${question.question}`);
          if (selectedOptions.length > 0) {
            lines.push(`- Selected: ${selectedOptions.join(", ")}`);
          }
          if (otherText) {
            lines.push(`- Other: ${otherText}`);
          }
        }

        return {
          ok: true,
          text: lines.join("\n")
        };
      }

      function renderAskUserQuestionContent(toolData, contentDiv) {
        const metadata = toolData && toolData.metadata && typeof toolData.metadata === "object"
          ? toolData.metadata
          : null;
        const questions = Array.isArray(metadata?.questions) ? metadata.questions : [];
        const wrapper = document.createElement("div");
        wrapper.className = "ask-user-question";

        const intro = document.createElement("div");
        intro.className = "ask-user-question-intro";
        intro.textContent = "The agent needs your input before it can continue.";
        wrapper.appendChild(intro);

        if (questions.length === 0) {
          const fallback = document.createElement("div");
          fallback.className = "ask-user-question-empty";
          fallback.textContent = toolData.output || "No questions were provided.";
          wrapper.appendChild(fallback);
          contentDiv.appendChild(wrapper);
          return true;
        }

        const form = document.createElement("form");
        form.className = "ask-user-question-form";

        questions.forEach((item, index) => {
          const block = document.createElement("fieldset");
          block.className = "ask-user-question-block";

          const legend = document.createElement("legend");
          legend.className = "ask-user-question-title";
          legend.textContent = item.question || `Question ${index + 1}`;
          block.appendChild(legend);

          const options = Array.isArray(item.options) ? item.options : [];
          options.forEach((option, optionIndex) => {
            const row = document.createElement("label");
            row.className = "ask-user-question-option";

            const input = document.createElement("input");
            input.type = item.multiSelect ? "checkbox" : "radio";
            input.name = `askq-${index}-option`;
            input.value = option.label || `Option ${optionIndex + 1}`;

            const textWrap = document.createElement("span");
            textWrap.className = "ask-user-question-option-text";

            const label = document.createElement("span");
            label.className = "ask-user-question-option-label";
            label.textContent = option.label || `Option ${optionIndex + 1}`;
            textWrap.appendChild(label);

            if (option.description) {
              const description = document.createElement("span");
              description.className = "ask-user-question-option-description";
              description.textContent = option.description;
              textWrap.appendChild(description);
            }

            row.appendChild(input);
            row.appendChild(textWrap);
            block.appendChild(row);
          });

          const otherWrap = document.createElement("label");
          otherWrap.className = "ask-user-question-other";

          const otherLabel = document.createElement("span");
          otherLabel.className = "ask-user-question-other-label";
          otherLabel.textContent = "Other";
          otherWrap.appendChild(otherLabel);

          const otherInput = document.createElement("textarea");
          otherInput.name = `askq-${index}-other`;
          otherInput.rows = 2;
          otherInput.placeholder = "Type your answer if none of the options fit";
          otherWrap.appendChild(otherInput);
          block.appendChild(otherWrap);

          form.appendChild(block);
        });

        const actions = document.createElement("div");
        actions.className = "ask-user-question-actions";

        const errorMessage = document.createElement("div");
        errorMessage.className = "ask-user-question-error";
        actions.appendChild(errorMessage);

        const submitButton = document.createElement("button");
        submitButton.type = "submit";
        submitButton.className = "ask-user-question-submit";
        submitButton.textContent = "Submit answer";
        actions.appendChild(submitButton);

        form.appendChild(actions);

        form.addEventListener("submit", (event) => {
          event.preventDefault();
          const reply = buildAskUserQuestionReply(questions, form);
          if (!reply.ok) {
            errorMessage.textContent = reply.error || "Please answer the question.";
            return;
          }
          errorMessage.textContent = "";
          setAskUserQuestionFormState(form, false);
          sendUserPromptText(reply.text);
        });

        wrapper.appendChild(form);
        contentDiv.appendChild(wrapper);
        setAskUserQuestionFormState(form, currentSessionStatus === "waiting_for_user");
        return false;
      }

      function addBubble(content, role, meta, shouldConnectToPrev = false) {

        }

        if (role === "user") {
          // 普通用户气泡
          bubble.textContent = content;
        } else if (role === "assistant") {
          if (meta && meta.asThinking === true) {

            header.className = "bubble-collapsible-header";

                  </svg>
                </span>
              </span>
            `;

            const contentDiv = document.createElement("div");
            contentDiv.className = "bubble-collapsible-content collapsed";

              } else {
                toggleBtn.classList.add("expanded");
              }
              // 折叠/展开后重新计算所有连接线

          } else {

            <span class="${dotClass}" style="background-color: var(--vscode-button-background);"></span>

              <span class="bubble-toggle">
                <svg viewBox="0 0 1024 1024" aria-hidden="true">
                  <path d="M884 256h-75c-5.1 0-9.9 2.5-12.9 6.6L512 654.2 227.9 262.6c-3-4.1-7.8-6.6-12.9-6.6h-75c-6.5 0-10.3 7.4-6.5 12.7l352.6 486.1c12.8 17.6 39 17.6 51.7 0l352.6-486.1c3.9-5.3.1-12.7-6.4-12.7z"></path>
                </svg>
              </span>
            </span>
          `;

          const contentDiv = document.createElement("div");
          contentDiv.className = "bubble-collapsible-content collapsed";
          contentDiv.textContent = skillDescription;

          header.addEventListener("click", () => {
            const isCollapsed = contentDiv.classList.toggle("collapsed");
            const toggleBtn = header.querySelector(".bubble-toggle");
            if (isCollapsed) {
              toggleBtn.classList.remove("expanded");

            requestAnimationFrame(() => {

          bubble.appendChild(contentDiv);
        } else if (role === "tool") {
          // 工具气泡（可折叠）
          let toolData = { ok: false, name: "unknown", output: "" };
          try {
            // content是JSON字符串，包含ok、name、output等字段
            toolData = JSON.parse(content || "{}");
          } catch (e) {
            // 忽略解析错误
          }

          const isOk = toolData.ok === true;

          const dotClasses = ["bubble-dot"];

          else dotClasses.push("error");

          header.innerHTML = `
            <span class="${dotClasses.join(' ')}"></span>

              <span class="bubble-title-text">${titleText}</span>
              <span class="bubble-toggle">
                <svg viewBox="0 0 1024 1024" aria-hidden="true">
                  <path d="M884 256h-75c-5.1 0-9.9 2.5-12.9 6.6L512 654.2 227.9 262.6c-3-4.1-7.8-6.6-12.9-6.6h-75c-6.5 0-10.3 7.4-6.5 12.7l352.6 486.1c12.8 17.6 39 17.6 51.7 0l352.6-486.1c3.9-5.3.1-12.7-6.4-12.7z"></path>

          }

          if (isAskUserQuestion) {
            renderAskUserQuestionContent(toolData, contentDiv);
          } else {
            const rendered = renderStructuredToolResult(toolData, contentDiv);
            if (!rendered) {
              // 优先显示resultMd，其次是output，最后是完整content
              let displayContent = resultMd;
              if (!displayContent && toolData.output) {
                displayContent = typeof toolData.output === 'string'
                  ? toolData.output
                  : JSON.stringify(toolData.output, null, 2);
              }
              if (!displayContent) {
                displayContent = content;
              }

              contentDiv.textContent = displayContent;
            }

              updateAllConnectionLines();
            });
          });

          bubble.appendChild(header);
          bubble.appendChild(contentDiv);

          const toolParams = header.querySelector(".tool-params");

            toolParams.dataset.tip = paramsMd;
            addToolParamsTooltip(toolParams);
          }
        }

        messages.appendChild(bubble);
        // 用户发消息时强制滚到底部；其他消息智能判断
        if (role === "user") {
          messages.scrollTop = messages.scrollHeight;
        } else if (messages.scrollTop + messages.clientHeight >= messages.scrollHeight - 60) {
          messages.scrollTop = messages.scrollHeight;
        }
        lastMessageRole = role;

        // 如果需要连接线，动态计算并设置连接线高度
        if (shouldConnectToPrev && role !== "user") {
          requestAnimationFrame(() => {
            updateConnectionLine(bubble);
          });
        }

        requestAnimationFrame(() => {
          updateAllConnectionLines();
        });

      function updateConnectionLine(currentBubble) {
        // 找到当前气泡的圆点
        const currentDot = currentBubble.querySelector('.bubble-dot.connect-to-prev');
        if (!currentDot) return;

        // 找到上一个气泡
        const prevBubble = currentBubble.previousElementSibling;
        if (!prevBubble) return;

        // 找到上一个气泡的圆点
        const prevDot = prevBubble.querySelector('.bubble-dot');
        if (!prevDot) return;

        // 计算两个圆点之间的距离
        const currentRect = currentDot.getBoundingClientRect();
        const prevRect = prevDot.getBoundingClientRect();
        const distance = currentRect.top - prevRect.bottom;

        // 设置连接线高度（加上圆点的半径补偿）
        if (distance > 0) {
          currentDot.style.setProperty('--line-height', `${distance}px`);
        }
      }

      function updateAllConnectionLines() {
        const bubbles = messages.querySelectorAll('.bubble');
        bubbles.forEach(bubble => {
          updateConnectionLine(bubble);
        });
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function renderStructuredToolResult(toolData, container) {
        if (!toolData || toolData.ok !== true) {
          return false;
        }

        const toolName = String(toolData.name || "").toLowerCase();
        if (toolName === "updateplan") {
          return renderUpdatePlanResult(toolData, container);
        }

        if (toolName !== "edit" && toolName !== "write") {
          return false;
        }

        const metadata = toolData.metadata && typeof toolData.metadata === "object"
          ? toolData.metadata
          : null;
        if (!metadata || typeof metadata.file_path !== "string") {
          return false;
        }

        const details = document.createElement("details");
        details.className = "tool-result-details";

        // summary 显示文件名 + 代码增删统计
        const summary = document.createElement("summary");
        summary.className = "tool-result-summary";
        var fpath = metadata.file_path ? getBasename(metadata.file_path) : (toolData.output || "Modified file");
        var dPreview = metadata.diff_preview;
        if (typeof dPreview === "string" && dPreview.trim()) {
          var dl = dPreview.split("\n");
          var da = 0, dr = 0;
          for (var di = 0; di < dl.length; di++) {
            var dli = dl[di];
            if (dli.charAt(0) === "+" && dli.slice(0, 4) !== "+++ ") da++;
            if (dli.charAt(0) === "-" && dli.slice(0, 4) !== "--- ") dr++;
          }
          summary.innerHTML = fpath + " <span style=\"color:#4caf50;font-weight:600\">+" + da + "</span> <span style=\"color:#f44336;font-weight:600\">-" + dr + "</span>";
        } else {
          summary.textContent = fpath;
        }
        details.appendChild(summary);

        if (typeof metadata.diff_preview === "string" && metadata.diff_preview.trim()) {
          const diffBlock = renderDiffPreview(metadata.diff_preview, metadata.file_path);
          if (diffBlock) {
            details.appendChild(diffBlock);
          }
        }

        container.appendChild(details);
        return true;
      }

      function renderUpdatePlanResult(toolData, container) {
        const metadata = toolData.metadata && typeof toolData.metadata === "object"
          ? toolData.metadata
          : null;
        const plan = typeof metadata?.plan === "string" ? metadata.plan.trim() : "";
        if (!plan) {
          return false;
        }

        const planBlock = document.createElement("div");
        planBlock.className = "update-plan-result update-plan-markdown";
        renderPlanMarkdown(plan, planBlock);

        container.appendChild(planBlock);
        return true;
      }

      function renderPlanMarkdown(markdown, container) {
        const lines = String(markdown || "").split(/\r?\n/);
        lines.forEach((line) => {
          const raw = line.replace(/\s+$/, "");
          if (!raw.trim()) {
            const spacer = document.createElement("div");
            spacer.className = "update-plan-spacer";
            container.appendChild(spacer);
            return;
          }

          const headingMatch = raw.match(/^(#{1,6})\s+(.+)$/);
          if (headingMatch) {
            const level = Math.min(6, headingMatch[1].length);
            const heading = document.createElement(`h${level}`);
            heading.className = "update-plan-heading";
            appendInlineMarkdown(heading, headingMatch[2].trim());
            container.appendChild(heading);
            return;
          }

          const taskMatch = raw.match(/^(\s*)[-*]\s+\[([ xX!>])\]\s*(.*)$/);
          if (taskMatch) {
            const indent = getMarkdownIndentLevel(taskMatch[1]);
            const status = normalizePlanStatus(taskMatch[2]);
            const row = document.createElement("div");
            row.className = `update-plan-task status-${status}`;
            row.style.setProperty("--plan-indent", String(indent));

            const marker = document.createElement("span");
            marker.className = "update-plan-status";
            marker.textContent = getPlanStatusLabel(status);
            row.appendChild(marker);

            const text = document.createElement("span");
            text.className = "update-plan-task-text";
            appendInlineMarkdown(text, taskMatch[3].trim());
            row.appendChild(text);

            container.appendChild(row);
            return;
          }

          const bulletMatch = raw.match(/^(\s*)[-*]\s+(.+)$/);
          if (bulletMatch) {
            const row = document.createElement("div");
            row.className = "update-plan-bullet";
            row.style.setProperty("--plan-indent", String(getMarkdownIndentLevel(bulletMatch[1])));
            const marker = document.createElement("span");
            marker.className = "update-plan-bullet-marker";
            marker.textContent = "•";
            row.appendChild(marker);
            const text = document.createElement("span");
            appendInlineMarkdown(text, bulletMatch[2].trim());
            row.appendChild(text);
            container.appendChild(row);
            return;
          }

          const paragraph = document.createElement("p");
          paragraph.className = "update-plan-paragraph";
          appendInlineMarkdown(paragraph, raw.trim());
          container.appendChild(paragraph);
        });
      }

      function getMarkdownIndentLevel(indent) {
        return Math.floor(String(indent || "").replace(/\t/g, "  ").length / 2);
      }

      function normalizePlanStatus(value) {
        if (value === "x" || value === "X") return "done";
        if (value === ">") return "active";
        if (value === "!") return "attention";
        return "todo";
      }

      function getPlanStatusLabel(status) {
        if (status === "done") return "✓";
        if (status === "active") return ">";
        if (status === "attention") return "!";
        return "";
      }

      function appendInlineMarkdown(parent, text) {
        parent.innerHTML = renderInlineMarkdown(text);
      }

      function renderInlineMarkdown(text) {
        return escapeHtml(String(text || ""))
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/\*([^*]+)\*/g, "<em>$1</em>");
      }

      function formatDisplayPath(filePath) {
        if (!filePath) {
          return "";
        }

        if (workspaceRoot && isPathInsideWorkspace(filePath, workspaceRoot)) {
          const relative = getRelativePath(filePath, workspaceRoot);
          if (relative) {
            return relative;
          }
        }

        return filePath;
      }

      function getBasename(filePath) {
        if (!filePath) return "";
        // Handle both / and \ path separators
        const normalized = String(filePath).replace(/\\/g, "/");
        const parts = normalized.split("/");
        return parts[parts.length - 1] || filePath;
      }

      function isPathInsideWorkspace(filePath, rootPath) {
        const normalizedFile = normalizePath(filePath);
        const normalizedRoot = normalizePath(rootPath);
        return normalizedFile === normalizedRoot || normalizedFile.startsWith(`${normalizedRoot}/`);
      }

      function getRelativePath(filePath, rootPath) {
        const normalizedFile = normalizePath(filePath);
        const normalizedRoot = normalizePath(rootPath);
        if (!normalizedFile.startsWith(normalizedRoot)) {
          return filePath;
        }
        return normalizedFile.slice(normalizedRoot.length).replace(/^\/+/, "");
      }

      function normalizePath(value) {
        return String(value || "").replace(/\\/g, "/").replace(/\/+$/, "");
      }

      /**
       * Renders a diff preview with clickable line numbers.
       * @param {string} diffPreview - unified diff text
       * @param {string} [filePath] - file path for line-number click navigation
       */
      function renderDiffPreview(diffPreview, filePath) {
        var lines = String(diffPreview || "").split("\n");

        var section = document.createElement("div");
        section.className = "tool-result-diff";

        var list = document.createElement("div");
        list.className = "diff-preview";

        // Track line numbers across hunks
        var newLine = 0;

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];
          if (!line) continue;

          // Skip ---/+++ headers
          if (line.startsWith("--- ") || line.startsWith("+++ ")) continue;

          // Parse @@ hunk header to set current line number
          var hunkMatch = line.match(/^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
          if (hunkMatch) {
            newLine = parseInt(hunkMatch[1], 10);
            continue;
          }

          var marker = line.charAt(0);
          var isAdd = marker === "+";
          var isDel = marker === "-";
          var isCtx = !isAdd && !isDel;

          var row = document.createElement("div");
          row.className = "diff-line";
          if (isAdd) row.classList.add("added");
          else if (isDel) row.classList.add("removed");
          else row.classList.add("context");

          // 行号（可点击跳转）
          var lineNum = document.createElement("span");
          lineNum.className = "diff-line-number";
          if (isAdd || isCtx) {
            lineNum.textContent = String(newLine);
            if (filePath) {
              lineNum.style.cursor = "pointer";
              lineNum.title = "Open at line " + newLine;
              (function (fp, ln) {
                lineNum.addEventListener("click", function (e) {
                  e.stopPropagation();
                  vscode.postMessage({ type: "openFile", filePath: fp, line: ln });
                });
              })(filePath, newLine);
            }
          }
          if (isAdd || isCtx) newLine++;

          // 标记 (+ / - / 空格)
          var markerSpan = document.createElement("span");
          markerSpan.className = "diff-line-marker";
          markerSpan.textContent = isAdd ? "+" : isDel ? "-" : " ";

          // 内容
          var content = document.createElement("span");
          content.className = "diff-line-content";
          content.textContent = line.slice(1);

          row.appendChild(lineNum);
          row.appendChild(markerSpan);
          row.appendChild(content);
          list.appendChild(row);
        }

        section.appendChild(list);
        return section;
      }

      /**
       * 渲染单条文件修改记录，样式与编辑工具结果一致（摘要 + FILE[路径] + CHANGES）。
       * 每条记录作为独立的气泡显示在聊天记录中，支持持久化。
       */
      function renderDiffSummaryMessage(msg) {
        var data = { files: [] };
        try { data = JSON.parse(msg.content || "{}"); } catch (e) {}
        var files = data.files || [];
        if (files.length === 0) return;

        // 统计所有 diff 中的 +/- 行数
        var totalAdded = 0, totalRemoved = 0;
        files.forEach(function (f) {
          if (!f.diffPreview) return;
          var lines = f.diffPreview.split("\n");
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i];
            if (line.charAt(0) === "+" && line.slice(0, 4) !== "+++ ") totalAdded++;
            if (line.charAt(0) === "-" && line.slice(0, 4) !== "--- ") totalRemoved++;
          }
        });

        // 父级气泡
        var bubble = document.createElement("div");
        bubble.className = "bubble assistant";

        var parentDetails = document.createElement("details");
        parentDetails.className = "tool-result-details";
        parentDetails.open = false; // 默认折叠

        // 标题：+N  -M（增加绿色，减少红色）
        var parentSummary = document.createElement("summary");
        parentSummary.className = "tool-result-summary changes-summary";
        parentSummary.innerHTML =
          "<span class=\"changes-summary-label\">Changes:</span>" +
          "<span class=\"changes-summary-stats\">" +
          "<span class=\"changes-added\">+" + totalAdded + "</span>" +
          "  <span class=\"changes-removed\">-" + totalRemoved + "</span>" +
          "  <span class=\"changes-filecount\">(" + files.length + " file" + (files.length > 1 ? "s" : "") + ")</span>" +
          "</span>";
        parentDetails.appendChild(parentSummary);

        // 内部：每个文件独立一块
        for (var fi = 0; fi < files.length; fi++) {
          var entry = files[fi];
          if (!entry || !entry.diffPreview) continue;

          var fileDetails = document.createElement("details");
          fileDetails.className = "tool-result-details";
          fileDetails.open = false; // 默认折叠

          // summary 显示文件名 + 该文件的 +/- 统计
          var summaryEl = document.createElement("summary");
          summaryEl.className = "tool-result-summary";
          // 计算单个文件的行数
          var fa = 0, fr = 0;
          if (entry.diffPreview) {
            var flines = entry.diffPreview.split("\n");
            for (var fi2 = 0; fi2 < flines.length; fi2++) {
              var fl = flines[fi2];
              if (fl.charAt(0) === "+" && fl.slice(0, 4) !== "+++ ") fa++;
              if (fl.charAt(0) === "-" && fl.slice(0, 4) !== "--- ") fr++;
            }
          }
          var fname = entry.filePath ? getBasename(entry.filePath) : (entry.output || "Modified file");
          summaryEl.innerHTML = fname + " <span style=\"color:#4caf50;font-weight:600\">+" + fa + "</span> <span style=\"color:#f44336;font-weight:600\">-" + fr + "</span>";
          fileDetails.appendChild(summaryEl);

          // diff 内容
          var diffBlock = renderDiffPreview(entry.diffPreview, entry.filePath);
          if (diffBlock) fileDetails.appendChild(diffBlock);

          parentDetails.appendChild(fileDetails);
        }

        bubble.appendChild(parentDetails);
        messages.appendChild(bubble);
        if (messages.scrollTop + messages.clientHeight >= messages.scrollHeight - 60) {
          messages.scrollTop = messages.scrollHeight;
        }
      }

      function addToolParamsTooltip(element) {
        const tooltipText = element.dataset.tip;
        if (!tooltipText) return;

        let tooltip = null;
        let showTimer = null;

        function updateTooltipPosition() {
          if (!tooltip) return;
          const rect = element.getBoundingClientRect();
          tooltip.style.left = rect.left + 'px';
          tooltip.style.top = (rect.bottom + 10) + 'px';
        }

        element.addEventListener('mouseenter', () => {
          // 清除旧的延迟任务
          if (showTimer) {
            clearTimeout(showTimer);
          }

          // 延迟 500ms 后显示 tooltip
          showTimer = setTimeout(() => {
            if (tooltip) {
              tooltip.remove();
            }
            tooltip = document.createElement('div');
            tooltip.className = 'tooltip show';
            tooltip.textContent = tooltipText;
            document.body.appendChild(tooltip);

            // 下一帧时更新位置，确保元素已渲染
            requestAnimationFrame(() => {
              updateTooltipPosition();
            });

            // 监听窗口大小变化和滚动
            const handleUpdate = () => updateTooltipPosition();
            window.addEventListener('resize', handleUpdate);
            window.addEventListener('scroll', handleUpdate, true);

            const handleMouseLeave = () => {
              if (tooltip) {
                tooltip.remove();
                tooltip = null;
              }
              window.removeEventListener('resize', handleUpdate);
              window.removeEventListener('scroll', handleUpdate, true);
              element.removeEventListener('mouseleave', handleMouseLeave);
            };

            element.addEventListener('mouseleave', handleMouseLeave);
          }, 500);
        });

        element.addEventListener('mouseleave', () => {
          // 鼠标离开时清除延迟任务和 tooltip
          if (showTimer) {
            clearTimeout(showTimer);
            showTimer = null;
          }
          if (tooltip) {
            tooltip.remove();
            tooltip = null;
          }
        });
      }

      function formatElapsedTime(startTimeIso) {
        const startTime = new Date(startTimeIso).getTime();
        const elapsedMs = Date.now() - startTime;
        const elapsedSeconds = Math.floor(elapsedMs / 1000);
        const minutes = Math.floor(elapsedSeconds / 60);
        const seconds = elapsedSeconds % 60;
        if (minutes > 0) {
          return `${minutes}m${seconds}s`;
        }
        return `${seconds}s`;
      }

      function updateLoadingText() {
        const loadingSpan = loading.querySelector('span');
        if (!loadingSpan) {
          return;
        }
        if (currentRunningProcesses && Object.keys(currentRunningProcesses).length > 0) {
          // 显示第一个运行中的进程（通常只有一个进程在运行）
          const firstPid = Object.keys(currentRunningProcesses)[0];
          const process = currentRunningProcesses[firstPid];
          const elapsed = formatElapsedTime(process.startTime);
          loadingSpan.textContent = `(${elapsed}) ${process.command}`;
          return;
        }

        if (currentLlmStreamProgress && currentLlmStreamProgress.startedAt) {
          const startedAt = new Date(currentLlmStreamProgress.startedAt).getTime();
          const elapsedSeconds = Math.max(0, Math.floor((Date.now() - startedAt) / 1000));
          if (elapsedSeconds >= 3) {
            const formattedTokens = currentLlmStreamProgress.formattedTokens || "0";
            loadingSpan.textContent = `Thinking... (${elapsedSeconds}s) · ↓ ${formattedTokens} tokens`;
            return;
          }
        }

        loadingSpan.textContent = 'Thinking...';
      }

      function setLoading(isLoading, status) {
        loading.classList.toggle("active", isLoading);
        if (status !== undefined) {
          currentSessionStatus = status;

        // 清除旧的计时器
        if (loadingUpdateTimer !== null) {
          clearInterval(loadingUpdateTimer);
          loadingUpdateTimer = null;
        }

        if (isLoading) {
          loadingUpdateTimer = setInterval(updateLoadingText, 1000);
        }

        // 更新初始文本
        updateLoadingText();

        // 切换图标
        if (isLoading) {
          sendIcon.style.display = "none";
          stopIcon.style.display = "block";
          sendButton.title = "Stop";

      function formatSessionDate(dateString) {
        const date = new Date(dateString);
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        const sessionDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());

        // 计算天数差异
        const diffTime = today.getTime() - sessionDate.getTime();
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

        if (diffDays === 0) {
          return "Today";
        } else if (diffDays === 1) {
          return "Yesterday";
        } else if (diffDays >= 2 && diffDays <= 7) {
          // 显示具体的星期几
          const weekdays = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
          return weekdays[sessionDate.getDay()];
        } else {
          return null; // 超过7天，不显示
        }
      }

      function renderFilteredSessions(searchQuery) {
        if (!sessionDropdownList) return;

        sessionDropdownList.innerHTML = "";
        const query = searchQuery.toLowerCase().trim();

        // 过滤会话
        const filteredSessions = allSessions.filter((session) => {
          const summary = (session.summary || "Untitled").toLowerCase();
          return summary.includes(query);
        });

        // 获取今天的开始时间
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        const lastWeek = new Date(today);
        lastWeek.setDate(lastWeek.getDate() - 7);

        // 按时间分组
        const groups = {
          today: [],
          yesterday: [],
          pastWeek: []
        };

        // 筛选并分组会话
        filteredSessions.forEach((session) => {
          const sessionDate = new Date(session.updateTime);
          const sessionDay = new Date(sessionDate.getFullYear(), sessionDate.getMonth(), sessionDate.getDate());

          if (sessionDay.getTime() === today.getTime()) {
            groups.today.push(session);
          } else if (sessionDay.getTime() === yesterday.getTime()) {
            groups.yesterday.push(session);
          } else if (sessionDay.getTime() > lastWeek.getTime() && sessionDay.getTime() < yesterday.getTime()) {
            groups.pastWeek.push(session);
          }
          // 超过7天的数据不显示
        });

        // 如果没有会话
        const totalCount = groups.today.length + groups.yesterday.length + groups.pastWeek.length;
        if (totalCount === 0) {
          const emptyDiv = document.createElement("div");
          emptyDiv.className = "session-dropdown-empty";
          emptyDiv.textContent = query ? "No sessions found" : "No sessions yet";
          sessionDropdownList.appendChild(emptyDiv);
          return;
        }

        // 创建分组渲染函数
        const renderGroup = (title, sessions) => {
          if (sessions.length === 0) return null;

          const groupDiv = document.createElement("div");
          groupDiv.className = "session-dropdown-group";

          const titleDiv = document.createElement("div");
          titleDiv.className = "session-dropdown-group-title";
          titleDiv.textContent = title;
          groupDiv.appendChild(titleDiv);

          sessions.forEach((session) => {
            const item = document.createElement("div");
            item.className = "session-dropdown-item";
            if (session.id === currentSessionId) {
              item.classList.add("active");
            }

            // 高亮搜索关键字
            const summary = session.summary || "Untitled";
            const highlightedSummary = query
              ? summary.replace(new RegExp(`(${escapeRegExp(query)})`, 'gi'), '<mark>$1</mark>')
              : summary;

            item.innerHTML = `
              <div class="session-dropdown-summary">${highlightedSummary}</div>
              <div class="session-dropdown-time">${formatSessionTime(session.updateTime)}</div>
            `;
            item.addEventListener("click", () => {
              sessionDropdown.classList.remove("show");
              sessionSelector.classList.remove("open");
              vscode.postMessage({ type: "selectSession", sessionId: session.id });
            });
            groupDiv.appendChild(item);
          });

          return groupDiv;
        };

        // 按顺序渲染分组
        const todayGroup = renderGroup("Today", groups.today);
        const yesterdayGroup = renderGroup("Yesterday", groups.yesterday);
        const pastWeekGroup = renderGroup("Past Week", groups.pastWeek);

        if (todayGroup) sessionDropdownList.appendChild(todayGroup);
        if (yesterdayGroup) sessionDropdownList.appendChild(yesterdayGroup);
        if (pastWeekGroup) sessionDropdownList.appendChild(pastWeekGroup);
      }

      function formatSessionTime(dateString) {
        const date = new Date(dateString);
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const sessionDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());

        // 计算天数差异
        const diffTime = today.getTime() - sessionDate.getTime();
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

        if (diffDays === 0) {
          // 今天，显示时间
          return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        } else {
          // 其他天，显示月/日
          const month = date.getMonth() + 1;
          const day = date.getDate();
          return `${month}/${day}`;
        }
      }

      function escapeRegExp(string) {
        return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      }

      function sendUserPromptText(text, skills, imageUrls) {
        const trimmed = (text || "").trim();
        const normalizedImages = Array.isArray(imageUrls) ? imageUrls.filter(Boolean) : [];
        if ((!trimmed && normalizedImages.length === 0) || sendButton.disabled) {
          return;

        historyCursor = -1;
        draftBeforeHistory = null;
        pendingUserPrompt = trimmed || (normalizedImages.length > 0 ? "粘贴的图像" : "");

        vscode.postMessage({
          type: "userPrompt",
          prompt: trimmed,
          skills: skills && skills.length > 0 ? skills : undefined,
          images: normalizedImages.length > 0 ? normalizedImages : undefined
        });

      function sendPrompt() {

          currentSessionStatus = "interrupted";
          setLoading(false, currentSessionStatus);
          return;

        // 检查输入内容
        const text = promptInput.value.trim();
        const imageUrls = getAttachedImageUrls();
        if ((!text && imageUrls.length === 0) || sendButton.disabled) {
          return;

        // 发送消息，不立即显示（等待后端返回渲染后的 HTML）
