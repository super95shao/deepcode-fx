        document.querySelectorAll(".toolbar-popup.show").forEach(function (p) { p.classList.remove("show"); });
      });

      setupDropdown("modelDropdownWrap", "modelToggleBtn", "modelPopup", function (val, display) {
        var shortName = val === "deepseek-v4-pro" ? "pro" : "flash";
        vscode.postMessage({ type: "loadSettings" });
        var cb = function (e) {
          if (e.data.type === "settingsData") {
            window.removeEventListener("message", cb);
            var userEnv = e.data.userSettings ? e.data.userSettings.env : undefined;
            var projEnv = e.data.projectSettings ? e.data.projectSettings.env : undefined;
            var userThinking = e.data.userSettings ? (e.data.userSettings.thinkingEnabled !== false) : true;
            var projThinking = e.data.projectSettings ? (e.data.projectSettings.thinkingEnabled !== false) : true;
            vscode.postMessage({ type: "saveBothSettings",
              userSettings: { model: val, env: userEnv, thinkingEnabled: userThinking },
              projectSettings: { model: val, env: projEnv, thinkingEnabled: projThinking }
            });
            document.getElementById("modelToggleBtn").textContent = L.model + ": " + shortName;
          }
        };
        window.addEventListener("message", cb);
        document.getElementById("modelToggleBtn").textContent = L.model + ": " + shortName;
      });

      setupDropdown("thinkingDropdownWrap", "thinkingToggleBtn", "thinkingPopup", function (val, display) {
        vscode.postMessage({ type: "loadSettings" });
        var cb = function (e) {
          if (e.data.type === "settingsData") {
            window.removeEventListener("message", cb);
            var userS = e.data.userSettings || {};
            var projS = e.data.projectSettings || {};
            var userThinking = (userS.thinkingEnabled !== false);
            var projThinking = (projS.thinkingEnabled !== false);
            vscode.postMessage({ type: "saveBothSettings",
              userSettings: { reasoningEffort: val, model: userS.model, env: userS.env, thinkingEnabled: userThinking },
              projectSettings: { reasoningEffort: val, model: projS.model, env: projS.env, thinkingEnabled: projThinking }
            });
            document.getElementById("thinkingToggleBtn").textContent = L.reasoning + ": " + display;
          }
        };
        window.addEventListener("message", cb);
        document.getElementById("thinkingToggleBtn").textContent = L.reasoning + ": " + display;
      });

      // 保存全局设置
      document.getElementById("userSettingsSave").addEventListener("click", function () {
        var s = {
          env: { API_KEY: document.getElementById("userApiKey").value || undefined },
          model: document.getElementById("userModel").value,
          thinkingEnabled: document.getElementById("userThinkingEnabled").checked,
          reasoningEffort: document.getElementById("userReasoningEffort").value,
        };
        // 清理空值
        if (!s.env.API_KEY) delete s.env;
        vscode.postMessage({ type: "saveUserSettings", settings: s });
        document.getElementById("userSettingsFeedback").textContent = "Saving...";
      });

      // 保存项目设置
      document.getElementById("projectSettingsSave").addEventListener("click", function () {
        var s = {
          env: { API_KEY: document.getElementById("projectApiKey").value || undefined },
          model: document.getElementById("projectModel").value,
          thinkingEnabled: document.getElementById("projectThinkingEnabled").checked,
          reasoningEffort: document.getElementById("projectReasoningEffort").value,
        };
        if (!s.env.API_KEY) delete s.env;
        vscode.postMessage({ type: "saveProjectSettings", settings: s });
        document.getElementById("projectSettingsFeedback").textContent = "Saving...";
      });

      // 工作区切换 banner 按钮
      document.getElementById("workspaceSwitchBtn").addEventListener("click", function () {
        var target = document.getElementById("workspaceBanner").dataset.targetPath;
        if (target) vscode.postMessage({ type: "switchWorkspace", path: target });
      });
      document.getElementById("workspaceBannerClose").addEventListener("click", function () {
        document.getElementById("workspaceBanner").style.display = "none";
      });
      // 设置页工作区 Apply
      document.getElementById("workspaceApplyBtn").addEventListener("click", function () {
        var p = document.getElementById("workspaceInput").value.trim();
        if (p) vscode.postMessage({ type: "switchWorkspace", path: p });
      });

      sendButton.addEventListener("click", sendPrompt);

      // ── Balance display ──
      const balanceBtn = document.getElementById("balanceBtn");
      const balanceAmount = document.getElementById("balanceAmount");

      function updateBalanceDisplay(balance) {
        if (!balanceAmount || !balanceBtn) return;
        // null 表示刷新失败，静默保留旧值
        if (!balance || typeof balance.total !== "number") return;
        const sym = balance.currency === "CNY" ? "¥" : "$";
        balanceAmount.textContent = sym + balance.total.toFixed(2);
        balanceBtn.classList.add("has-balance");
        balanceBtn.classList.toggle("balance-low", balance.total < 10);
        balanceBtn.title = sym + balance.total.toFixed(2) + " · Click to view usage";
      }

      if (balanceBtn) {
        balanceBtn.addEventListener("click", () => {
          vscode.postMessage({ type: "openUrl", url: "https://platform.deepseek.com/usage" });
        });
      }

      // Request balance on load
      vscode.postMessage({ type: "requestBalance" });

      promptInput.addEventListener("keydown", (event) => {
        // History navigation: only intercept ArrowUp/Down at the very start/end of the textarea.
        // Otherwise keep native cursor movement (line up/down).
        const noModifier = !event.shiftKey && !event.altKey && !event.ctrlKey && !event.metaKey;

        function isCaretCollapsedAtStart(el) {
          return el.selectionStart === 0 && el.selectionEnd === 0;
        }

        function isCaretCollapsedAtEnd(el) {
          const len = el.value.length;
          return el.selectionStart === len && el.selectionEnd === len;
        }

        function applyPromptValue(value, caret = "end") {
          promptInput.value = value;
          autoResizePrompt();
          vscode.setState({ promptText: promptInput.value });
          updateSendIconState();
          promptInput.focus();
          const len = promptInput.value.length;
          if (caret === "start") {
            promptInput.setSelectionRange(0, 0);
          } else {
            promptInput.setSelectionRange(len, len);
          }
        }

        // Exit history browsing mode on any non-ArrowUp/ArrowDown key
        if (historyCursor !== -1 && event.key !== "ArrowUp" && event.key !== "ArrowDown") {
          exitHistoryBrowsing();
          // fall through — let the key event continue normally (typing, Enter, Backspace, etc.)
        }

        function navigateHistory(direction) {
          if (!inputHistory || inputHistory.length === 0) {
            return;
          }

          // Enter history browsing mode
          if (historyCursor === -1) {
            draftBeforeHistory = promptInput.value;
            historyCursor = inputHistory.length; // virtual position after the last item
          }

          historyCursor += direction;

          // Clamp: [0..inputHistory.length]
          if (historyCursor < 0) historyCursor = 0;
          if (historyCursor > inputHistory.length) historyCursor = inputHistory.length;

          if (historyCursor === inputHistory.length) {
            // Restore draft and exit history mode
            applyPromptValue(draftBeforeHistory ?? "", "end");
            historyCursor = -1;
            draftBeforeHistory = null;
            return;
          }

          // ArrowUp-triggered navigation is more convenient with caret at start for repeated browsing.
          applyPromptValue(inputHistory[historyCursor] ?? "", direction < 0 ? "start" : "end");
        }

        if (event.key === "Enter") {
          if (event.shiftKey) {
            // Shift+回车：允许换行（默认行为）
            return;
          } else {
            // 回车：发送消息
            event.preventDefault();
            sendPrompt();
          }
        } else if (event.key === "ArrowUp" && noModifier) {
          if ((historyCursor !== -1 || isCaretCollapsedAtStart(promptInput)) && inputHistory.length > 0) {
            event.preventDefault();
            navigateHistory(-1);
          }
        } else if (event.key === "ArrowDown" && noModifier) {
          // Only navigate forward if we're already in history browsing mode
          if (historyCursor !== -1 || isCaretCollapsedAtEnd(promptInput)) {
            event.preventDefault();
            navigateHistory(1);
          }
        }
      });

      function addMessageBubble(msg, shouldConnect) {
        if (msg.role === "system") {
          addBubble(msg.content, "system", msg.meta, shouldConnect);
        } else if (msg.role === "user") {
          addBubble(msg.content, "user", msg.meta, false);
        } else if (msg.role === "assistant") {
          // 文件修改汇总：渲染成可点击的编辑结果样式
          if (msg.meta && msg.meta.isDiffSummary) {
            renderDiffSummaryMessage(msg);
          } else {
            addBubble(msg.html || msg.content, "assistant", msg.meta, shouldConnect);
          }
        } else if (msg.role === "tool") {
          addBubble(msg.content, "tool", msg.meta, shouldConnect);
        }
      }

      window.addEventListener("message", (event) => {
        const message = event.data;
        if (message.type === "initializeEmpty") {
          // 初始化空聊天
          clearMessages();
          if (sessionSelectorTitleText) {
            sessionSelectorTitleText.textContent = "New Conversation";
          }
          currentSessionId = null;
          currentSessionStatus = message.status || null;
          updateContextMeter(message.tokenTelemetry);
          attachmentManager?.clear();
          setLoading(false, currentSessionStatus);

          // Reset history for new conversation
          inputHistory = [];
          historyCursor = -1;
          draftBeforeHistory = null;
          pendingUserPrompt = null;
          // 如果消息中包含sessions，更新下拉框
          if (message.sessions && Array.isArray(message.sessions)) {
            updateSessionDropdown(message.sessions);
          } else if (allSessions.length > 0) {
            updateSessionDropdown(allSessions);
          }
        } else if (message.type === "loadSession") {
          // 加载已有对话
          currentSessionId = message.sessionId;
          currentSessionStatus = message.status || null;
          // 跨项目提示 banner：用插件当前工作区判断，而非 VSCode 工作区
          var origPath = message.originalProjectPath;
          var curRoot = message.currentProjectRoot;
          var banner = document.getElementById("workspaceBanner");
          if (origPath && curRoot && origPath !== curRoot) {
            banner.querySelector(".workspace-banner-path").textContent = origPath;
            banner.style.display = "flex";
            banner.dataset.targetPath = origPath;
          } else {
            banner.style.display = "none";
          }
          updateContextMeter(message.tokenTelemetry);
          if ('processes' in message) {
            currentRunningProcesses = message.processes;
          } else {
            currentRunningProcesses = null;
          }
          attachmentManager?.clear();
          clearMessages();
          if (sessionSelectorTitleText) {
            sessionSelectorTitleText.textContent = message.summary;
          }

          // 加载历史消息
          if (message.messages && Array.isArray(message.messages)) {
            // Rebuild user input history from session messages
            inputHistory = message.messages
              .filter((m) => m && m.role === "user" && typeof m.content === "string")
              .map((m) => m.content)
              .filter((t) => t && t.trim());
            historyCursor = -1;
            draftBeforeHistory = null;
            pendingUserPrompt = null;

            message.messages.forEach((msg, index) => {
              // 判断是否需要连接到上一个消息
              let shouldConnect = false;
              if (index > 0) {
                const prevMsg = message.messages[index - 1];
                shouldConnect = prevMsg.role !== "user" && msg.role !== "user";
              }
              addMessageBubble(msg, shouldConnect);
            });

            // 更新 lastMessageRole 为最后一条消息的role
            if (message.messages.length > 0) {
              lastMessageRole = message.messages[message.messages.length - 1].role;
            }

            // 批量更新所有连接线的高度
            requestAnimationFrame(() => {
              updateAllConnectionLines();
              // 初始加载时强制滚动到底部
              messages.scrollTop = messages.scrollHeight;
            });

            // 找最后一条 asThinking 为 true 的消息并展开
            const thinkingBubbles = messages.querySelectorAll('.bubble.assistant[data-thinking="true"]');
            if (thinkingBubbles.length > 0) {
              const lastThinkingBubble = thinkingBubbles[thinkingBubbles.length - 1];
              if (currentThinkingBubble && currentThinkingBubble !== lastThinkingBubble) {
                setThinkingBubbleExpanded(currentThinkingBubble, false);
              }
              setThinkingBubbleExpanded(lastThinkingBubble, true);
              currentThinkingBubble = lastThinkingBubble;
            }
          }

          // 设置会话状态
          const isCurrentlyProcessing = isBusyStatus(currentSessionStatus);
          setLoading(isCurrentlyProcessing, currentSessionStatus);

          // 如果消息中包含sessions，更新下拉框
          if (message.sessions && Array.isArray(message.sessions)) {
            updateSessionDropdown(message.sessions);
          } else if (allSessions.length > 0) {
            updateSessionDropdown(allSessions);
          }
        } else if (message.type === "showSessionsList") {
          // 更新对话列表下拉框
          updateSessionDropdown(message.sessions || []);
        } else if (message.type === "sessionStatus") {
          if (message.sessionId && currentSessionId && message.sessionId !== currentSessionId) {
            return;
          }
          const nextStatus = message.status || null;
          if ('processes' in message) {
            currentRunningProcesses = message.processes;
          }
          if ('tokenTelemetry' in message) {
            updateContextMeter(message.tokenTelemetry);
          }
          setLoading(isBusyStatus(nextStatus), nextStatus);
          // 回答完毕后自动刷新余额
          if (nextStatus === "completed") {
            vscode.postMessage({ type: "requestBalance" });
          }
        } else if (message.type === "llmStreamProgress") {
          const progress = message.progress || null;
          if (!progress || !progress.requestId) {
            return;
          }
          if (progress.sessionId && currentSessionId && progress.sessionId !== currentSessionId) {
            return;
          }
          if (progress.phase === "end") {
            if (currentLlmStreamProgress && currentLlmStreamProgress.requestId === progress.requestId) {
              currentLlmStreamProgress = null;
            }
          } else {
            currentLlmStreamProgress = progress;
          }
          updateLoadingText();
        } else if (message.type === "userMessage") {
          // 显示用户消息（纯文本）
          addBubble(message.content || "", "user", message.meta, false);

          // Record user message into history
          if (typeof message.content === "string") {
            // Inline helper to avoid hoisting issues: duplicate minimal recording logic
            const text = message.content;
            const now = Date.now();
            if (pendingUserPrompt !== null && text === pendingUserPrompt) {
              inputHistory.push(text);
              pendingUserPrompt = null;
              lastHistoryRecordText = text;
              lastHistoryRecordAt = now;
            } else if (!(text === lastHistoryRecordText && (now - lastHistoryRecordAt) < 500) && text.trim()) {
              inputHistory.push(text);
              lastHistoryRecordText = text;
              lastHistoryRecordAt = now;
              pendingUserPrompt = null;
            }
          }
        } else if (message.type === "assistant") {
          // 接收助手回复
          const shouldConnect = lastMessageRole !== null && lastMessageRole !== "user";
          addBubble(message.html || "", "assistant", message.meta, shouldConnect);
        } else if (message.type === "loading") {
          // 加载状态
          const newStatus = message.value ? "processing" : currentSessionStatus;
          setLoading(Boolean(message.value), newStatus);
        } else if(message.type === "appendMessage") {
          // 新增消息
          addMessageBubble(message.message, message.shouldConnect);

          // Record appended user message into history (when backend sends user messages via appendMessage)
          if (message.message && message.message.role === "user" && typeof message.message.content === "string") {
            const text = message.message.content;
            const now = Date.now();
            if (pendingUserPrompt !== null && text === pendingUserPrompt) {
              inputHistory.push(text);
              pendingUserPrompt = null;
              lastHistoryRecordText = text;
              lastHistoryRecordAt = now;
            } else if (!(text === lastHistoryRecordText && (now - lastHistoryRecordAt) < 500) && text.trim()) {
              inputHistory.push(text);
              lastHistoryRecordText = text;
              lastHistoryRecordAt = now;
              pendingUserPrompt = null;
            }
          }

          // 如果是普通 assistant 消息（不是思考），说明本轮回复已完成，标记为 completed
          if (message.message.role === "assistant" && message.message.meta?.asThinking !== true) {
            currentSessionStatus = "completed";
            setLoading(false, currentSessionStatus);
          }

          // 如果是新的 asThinking 为 true 的消息，展开最新的思考气泡
          if (message.message.role === "assistant" && message.message.meta?.asThinking === true) {
            // 找最后一条 thinking 气泡
            const thinkingBubbles = messages.querySelectorAll('.bubble.assistant[data-thinking="true"]');
            if (thinkingBubbles.length > 0) {
              const lastThinkingBubble = thinkingBubbles[thinkingBubbles.length - 1];
              if (currentThinkingBubble && currentThinkingBubble !== lastThinkingBubble) {
                setThinkingBubbleExpanded(currentThinkingBubble, false);
              }
              setThinkingBubbleExpanded(lastThinkingBubble, true);
              currentThinkingBubble = lastThinkingBubble;
            }
          }
        } else if (message.type === "skillsList") {
          availableSkills = message.skills || [];
          updateSkillsButtonTooltip();
        } else if (message.type === "settingsData") {
          applySettingsToUI(message);
          var ws = message.sessionManagerRoot || message.currentWorkspace || "";
          document.getElementById("workspaceDisplay").textContent = ws;
        } else if (message.type === "saveResult") {
          var feedback = document.getElementById(message.scope + "SettingsFeedback");
          feedback.textContent = message.success ? "Saved ✓" : "Save failed ✗";
          setTimeout(function () { feedback.textContent = ""; }, 2500);
          if (message.success) loadSettings();
        } else if (message.type === "balanceData") {
          updateBalanceDisplay(message.balance);
        } else if (message.type === "workspaceChanged") {
          document.getElementById("workspaceBanner").style.display = "none";
          document.getElementById("workspaceDisplay").textContent = message.path;
          loadSettings();
        } else if (message.type === "workspaceInfo") {
          var wsRoot = message.sessionManagerRoot || message.workspaceRoot || "";
          document.getElementById("workspaceDisplay").textContent = wsRoot;
        }
      });

      // 监听窗口大小变化，重新计算连接线
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          updateAllConnectionLines();
        }, 100);
      });

      // webview 准备就绪，请求初始数据
      vscode.postMessage({ type: "ready" });

      // 请求可用技能列表
      vscode.postMessage({ type: "requestSkills" });

      // 初始化读取设置，使右下角按钮显示真实值
      setTimeout(function () { loadSettings(); }, 100);
    </script>
  </body>
</html>
